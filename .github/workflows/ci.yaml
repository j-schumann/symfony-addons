name: "Continuous Integration"

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  COMPOSER_FLAGS: "--ansi --no-interaction --no-progress --prefer-dist"
  COMPOSER_UPDATE_FLAGS: ""

jobs:
  phpunit-mariadb:
    name: Test PHP ${{ matrix.php }}, ${{ matrix.database }}, ${{ matrix.dependencies }} deps
    runs-on: ubuntu-26.04

    # don't mark the whole pipeline failed if one of those fails, there might
    # be incompatibilities with upcoming PHP versions
    continue-on-error: ${{ matrix.php == '8.6' }}
    services:
      mariadb:
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
          MARIADB_DATABASE: dbtest
          MARIADB_MYSQL_LOCALHOST_GRANTS: USAGE
          MARIADB_MYSQL_LOCALHOST_USER: 1
          MARIADB_PASSWORD: dbtest
          MARIADB_USER: dbtest
        image: mariadb:13@sha256:f1bba652ba57bea3099ca2fe1af692af537c27d96e0bcde39dce29e2ba1ec4f3
        options: >-
          --tmpfs /var/lib/mysql:rw,size=1g
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    strategy:
      fail-fast: false
      matrix:
        database: [ mariadb ]
        dependencies: [ highest, lowest ]
        include:
          - coverage: true
            dependencies: highest
            php: '8.5'
        php: [ '8.5', '8.6' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Common PHP setup
        uses: ./.github/actions/php-setup
        with:
          coverage: ${{ matrix.coverage }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

      - name: Run tests on MariaDB
        env:
          DATABASE_URL: mysql://dbtest:dbtest@127.0.0.1:3306/dbtest?serverVersion=mariadb-12.0.0&charset=utf8mb4
        run: vendor/bin/phpunit $PHPUNIT_COVERAGE_FLAGS --log-junit build/logs/phpunit/junit.xml

      - name: Upload test results
        uses: ./.github/actions/upload-phpunit-logs
        with:
          coverage: ${{ matrix.coverage }}
          database: ${{ matrix.database }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

  phpunit-mysql:
    name: Test PHP ${{ matrix.php }}, ${{ matrix.database }}, ${{ matrix.dependencies }} deps
    runs-on: ubuntu-26.04

    # don't mark the whole pipeline failed if one of those fails, there might
    # be incompatibilities with upcoming PHP versions
    continue-on-error: ${{ matrix.php == '8.6' }}
    services:
      mysql:
        env:
          MYSQL_DATABASE: dbtest
          MYSQL_PASSWORD: dbtest
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: dbtest
        image: mysql:lts@sha256:091c9c7c4b6a6b4d2329d54b7f40d323741785ca990469df9a1d706be0db43e7
        options: >-
          --tmpfs /var/lib/mysql:rw,size=1g
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    strategy:
      fail-fast: false
      matrix:
        database: [ mysql ]
        dependencies: [ highest, lowest ]
        include:
          - coverage: true
            dependencies: highest
            php: '8.5'
        php: [ '8.5', '8.6' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Common PHP setup
        uses: ./.github/actions/php-setup
        with:
          coverage: ${{ matrix.coverage }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

      - name: Run tests on MySQL
        env:
          DATABASE_URL: mysql://dbtest:dbtest@127.0.0.1:3306/dbtest?serverVersion=9.0&charset=utf8mb4
        run: vendor/bin/phpunit $PHPUNIT_COVERAGE_FLAGS --log-junit build/logs/phpunit/junit.xml

      - name: Upload test results
        uses: ./.github/actions/upload-phpunit-logs
        with:
          coverage: ${{ matrix.coverage }}
          database: ${{ matrix.database }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

  phpunit-postgres:
    name: Test PHP ${{ matrix.php }}, ${{ matrix.database }}, ${{ matrix.dependencies }} deps
    runs-on: ubuntu-26.04

    # don't mark the whole pipeline failed if one of those fails, there might
    # be incompatibilities with upcoming PHP versions
    continue-on-error: ${{ matrix.php == '8.6' }}
    services:
      postgres:
        env:
          POSTGRES_DB: dbtest
          POSTGRES_PASSWORD: dbtest
          POSTGRES_USER: dbtest
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        options: >-
          --tmpfs /var/lib/postgresql/18/docker:rw,size=1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "5432:5432"
    strategy:
      fail-fast: false
      matrix:
        database: [ postgres ]
        dependencies: [ highest, lowest ]
        include:
          - coverage: true
            dependencies: highest
            php: '8.5'
        php: [ '8.5', '8.6' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Common PHP setup
        uses: ./.github/actions/php-setup
        with:
          coverage: ${{ matrix.coverage }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

      - name: Run tests on Postgres
        env:
          DATABASE_URL: pgsql://dbtest:dbtest@127.0.0.1:5432/dbtest?serverVersion=18
        run: vendor/bin/phpunit $PHPUNIT_COVERAGE_FLAGS --log-junit build/logs/phpunit/junit.xml

      - name: Upload test results
        uses: ./.github/actions/upload-phpunit-logs
        with:
          coverage: ${{ matrix.coverage }}
          database: ${{ matrix.database }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

  phpunit-sqlite:
    name: Test PHP ${{ matrix.php }}, ${{ matrix.database }}, ${{ matrix.dependencies }} deps
    runs-on: ubuntu-26.04

    # don't mark the whole pipeline failed if one of those fails, there might
    # be incompatibilities with upcoming PHP versions
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        database: [ sqlite ]
        dependencies: [ highest, lowest ]
        include:
          - coverage: true
            dependencies: highest
            php: '8.5'
        php: [ '8.4', '8.5', '8.6' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Common PHP setup
        uses: ./.github/actions/php-setup
        with:
          coverage: ${{ matrix.coverage }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

      - name: Run tests on Sqlite
        env:
          # /dev/shm is the runner's tmpfs, the counterpart to the --tmpfs
          # datadirs of the other jobs
          DATABASE_URL: sqlite:////dev/shm/data.db
        run: vendor/bin/phpunit $PHPUNIT_COVERAGE_FLAGS --log-junit build/logs/phpunit/junit.xml

      - name: Upload test results
        uses: ./.github/actions/upload-phpunit-logs
        with:
          coverage: ${{ matrix.coverage }}
          database: ${{ matrix.database }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

  phpunit-sqlsrv:
    name: Test PHP ${{ matrix.php }}, ${{ matrix.database }}, ${{ matrix.dependencies }} deps
    runs-on: ubuntu-26.04

    # don't mark the whole pipeline failed if one of those fails, there might
    # be incompatibilities with upcoming PHP versions
    continue-on-error: ${{ matrix.php == '8.6' }}
    services:
      mssql:
        env:
          ACCEPT_EULA: "Y"
          MSSQL_DATABASE: dbtest
          MSSQL_PASSWORD: dbtest
          MSSQL_SA_PASSWORD: "StrongP-ssw0rd!"
          MSSQL_USER: dbtest
        image: kcollins/mssql:latest@sha256:95c2666d3a7c5dfaaf7247585057285ab7617fdcba213fff70f30ad92ce2a44a
        options: --tmpfs /var/opt/mssql/data:rw,size=2g
        ports:
          - "1433:1433"
    strategy:
      fail-fast: false
      matrix:
        database: [ sqlsrv ]
        dependencies: [ highest, lowest ]
        include:
          - coverage: true
            dependencies: highest
            php: '8.5'
        php: [ '8.5', '8.6' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Common PHP setup
        uses: ./.github/actions/php-setup
        with:
          coverage: ${{ matrix.coverage }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

      - name: Run tests on SQL Server
        env:
          DATABASE_URL: sqlsrv://sa:StrongP-ssw0rd!@127.0.0.1:1433/dbtest?serverVersion=16&charset=utf-8&driverOptions[Encrypt]=0

        # the sqlsrv extension is already installed, but it also requires the
        # ODBC driver for Linux
        run: |
          sudo sh -c 'curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list
          apt-get update
          ACCEPT_EULA=Y apt-get install -y msodbcsql18'
          vendor/bin/phpunit $PHPUNIT_COVERAGE_FLAGS --log-junit build/logs/phpunit/junit.xml

      - name: Upload test results
        uses: ./.github/actions/upload-phpunit-logs
        with:
          coverage: ${{ matrix.coverage }}
          database: ${{ matrix.database }}
          dependencies: ${{ matrix.dependencies }}
          php: ${{ matrix.php }}

  coverage-finished:
    name: Merge the coverage results
    needs: [ phpunit-mariadb, phpunit-mysql, phpunit-postgres, phpunit-sqlite, phpunit-sqlsrv ]
    runs-on: ubuntu-26.04

    # also merge the uploads of the successful jobs when another job failed
    if: always()
    steps:
      - name: Finish the parallel Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true
