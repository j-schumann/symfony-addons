name: 'PHP project setup'
description: 'Common PHP + Composer setup for all test jobs'

inputs:
  coverage:
    required: false
    default: 'false'
    description: Whether to collect the code coverage
  dependencies:
    required: true
    description: lowest|highest
  php:
    required: true
    description: PHP Version to use

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        coverage: ${{ inputs.coverage == 'true' && 'pcov' || 'none' }}
        extensions: intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlsrv, sqlsrv
        ini-values: memory_limit=-1
        php-version: ${{ inputs.php }}
        tools: composer, pecl

    - name: Handle lowest dependencies update
      if: contains(inputs.dependencies, 'lowest')
      shell: bash
      run: echo "COMPOSER_UPDATE_FLAGS=$COMPOSER_UPDATE_FLAGS --prefer-lowest" >> $GITHUB_ENV

    - name: Get composer cache directory
      id: composercache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        path: ${{ steps.composercache.outputs.dir }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Enable code coverage
      if: inputs.coverage == 'true'
      shell: bash
      run: |
        echo "PHPUNIT_COVERAGE_FLAGS=--coverage-clover build/logs/phpunit/clover.xml" \
          >> $GITHUB_ENV

    - name: "Update dependencies from composer.json using composer binary provided by system"
      shell: bash
      run: "composer update ${{ env.COMPOSER_UPDATE_FLAGS }} ${{ env.COMPOSER_FLAGS }}"
