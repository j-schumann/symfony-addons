name: 'Upload PHPUnit logs'
description: 'Upload PHPUnit logs with a consistent artifact name'

inputs:
  coverage:
    required: false
    default: 'false'
    description: Whether to upload the coverage results to Coveralls as part of a parallel build
  database:
    required: true
    description: Database being used
  dependencies:
    required: true
    description: Dependencies being used
  php:
    required: true
    description: PHP Version being used

runs:
  using: 'composite'
  steps:
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        # the artifact name must be unique within the workflow run
        name: phpunit-logs-${{ inputs.php }}-${{ inputs.database }}-${{ inputs.dependencies }}
        path: build/logs/phpunit
      continue-on-error: true

    - name: Upload coverage results to Coveralls
      if: inputs.coverage == 'true'
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
      with:
        file: build/logs/phpunit/clover.xml
        flag-name: ${{ inputs.database }}
        format: clover

        # the coverage-finished job of the workflow merges the uploads of all jobs into one report
        parallel: true
      continue-on-error: true
